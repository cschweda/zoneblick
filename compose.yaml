# zoneblick with Docker Compose.
#
# 1. Copy packaging/zoneblick.docker.toml to ./zoneblick.toml and add your
#    zones.
# 2. docker compose up -d
# 3. Read the API token the daemon made on its first start:
#      docker compose exec zoneblick /usr/local/bin/zoneblick token --show /etc/zoneblick.toml
#    (or set token_sha256 in zoneblick.toml; the file explains how)
# 4. Open http://127.0.0.1:8053 and enter the token.

services:
  zoneblick:
    image: ghcr.io/cschweda/zoneblick:latest
    restart: unless-stopped
    ports:
      # Published on this machine only. Put a reverse proxy with TLS in
      # front for remote access.
      - "127.0.0.1:8053:8053"
    volumes:
      - zoneblick-data:/data
      - ./zoneblick.toml:/etc/zoneblick.toml:ro

volumes:
  zoneblick-data:
