# Builds zoneblick binaries and publishes them as a GitHub Release.
#
# - Push a tag like v0.1.0 to build all targets and publish a release.
# - A pull request that touches the build inputs, or a manual run, builds
#   all targets as a dry run and publishes nothing.
#
# SQLite is compiled in from source (rusqlite's "bundled" feature), so every
# build needs a C compiler. The Linux builds link statically against musl,
# which needs the musl-tools package for its C compiler wrapper.
# Linux and macOS archives are .tar.gz; the Windows archive is a .zip.

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Tag matches the crate version
        if: github.ref_type == 'tag'
        run: |
          crate="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$crate" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Install the musl C compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        # Run the binary offline against a recorded fixture. The Intel macOS
        # build is cross-compiled on Apple Silicon and runs under Rosetta
        # when it is available; skip it there rather than depend on that.
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          bin=target/${{ matrix.target }}/release/zoneblick
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          "$bin" --version
          "$bin" check good.example --replay tests/fixtures/good.example.json
          # Exercise the bundled SQLite too: store two runs and diff them.
          db="$RUNNER_TEMP/smoke.sqlite"
          "$bin" run drift.example --db "$db" --name www --name api --name shop --name staging \
            --replay tests/fixtures/drift.example.before.json
          "$bin" run drift.example --db "$db" --replay tests/fixtures/drift.example.after.json || [ $? -eq 1 ]
          "$bin" diff drift.example --db "$db" || [ $? -eq 1 ]
          "$bin" zones list --db "$db"
      - name: Package
        run: |
          version="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then version="dev"; fi
          name="zoneblick-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY.md "dist/${name}/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/zoneblick.exe" "dist/${name}/"
            (cd dist && 7z a -tzip "${name}.zip" "${name}")
          else
            cp "target/${{ matrix.target }}/release/zoneblick" "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi
          rm -r "dist/${name}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zoneblick-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Versions below 1.0 are published as pre-releases.
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "zoneblick $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease

  image:
    name: publish container image
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Lay out the Linux binaries by Docker architecture
        id: prep
        run: |
          for pair in "x86_64:amd64" "aarch64:arm64"; do
            arch="${pair%%:*}"
            docker_arch="${pair##*:}"
            name="zoneblick-${GITHUB_REF_NAME}-${arch}-unknown-linux-musl"
            tar -xzf "artifacts/${name}.tar.gz" -C artifacts
            mkdir -p "dist/${docker_arch}"
            cp "artifacts/${name}/zoneblick" "dist/${docker_arch}/zoneblick"
          done
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The image only copies files, so both architectures build without emulation.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.prep.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
      - name: Smoke test the published image
        run: docker run --rm "ghcr.io/${{ github.repository }}:${{ steps.prep.outputs.version }}" --version

