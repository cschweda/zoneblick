# Builds zoneblick binaries and publishes them as a GitHub Release.
#
# - Push a tag like v0.1.0 to build all targets and publish a release.
# - A pull request that touches the build inputs, or a manual run, builds
#   all targets as a dry run and publishes nothing.
#
# The crate has no C dependencies, so the Linux builds link statically
# against musl with Rust's bundled linker and need no extra packages.
# Linux and macOS archives are .tar.gz; the Windows archive is a .zip.

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Tag matches the crate version
        if: github.ref_type == 'tag'
        run: |
          crate="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$crate" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        # Run the binary offline against a recorded fixture. The Intel macOS
        # build is cross-compiled on Apple Silicon and runs under Rosetta
        # when it is available; skip it there rather than depend on that.
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          bin=target/${{ matrix.target }}/release/zoneblick
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          "$bin" --version
          "$bin" check good.example --replay tests/fixtures/good.example.json
      - name: Package
        run: |
          version="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then version="dev"; fi
          name="zoneblick-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${name}/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/zoneblick.exe" "dist/${name}/"
            (cd dist && 7z a -tzip "${name}.zip" "${name}")
          else
            cp "target/${{ matrix.target }}/release/zoneblick" "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi
          rm -r "dist/${name}"
      - uses: actions/upload-artifact@v7
        with:
          name: zoneblick-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Versions below 1.0 are published as pre-releases.
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "zoneblick $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease
