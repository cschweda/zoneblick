# zoneblick configuration for the Docker image.

[server]
# Inside the container the server must listen on all interfaces; compose.yaml
# publishes the port on 127.0.0.1 of the host only.
bind = "0.0.0.0:8053"
data_dir = "/data"
# The API and the web UI always ask for a token. Leave token_sha256 out and
# the daemon makes one on its first start, in the data volume. Read it with:
#   docker compose exec zoneblick /usr/local/bin/zoneblick token --show /etc/zoneblick.toml
# To choose your own, store only its hash here:
#   TOKEN=$(openssl rand -hex 32); echo "$TOKEN"
#   printf '%s' "$TOKEN" | docker run --rm -i ghcr.io/cschweda/zoneblick:latest token
# token_sha256 = "..."

[schedule]
every = "1h"
max_qps_per_server = 5

# One [[zone]] block per zone you control.
[[zone]]
name = "example.org"
seeds = ["www", "mail"]

# [alerts.webhook]
# url = "https://example.org/hooks/zoneblick"

# [alerts.ntfy]
# url = "https://ntfy.sh/your-topic"
