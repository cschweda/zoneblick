[package]
name = "zoneblick"
version = "0.4.0"
edition = "2024"
description = "A self-hosted DNS zone watchdog"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cschweda/zoneblick"
homepage = "https://zoneblick.com"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8.9"
clap = { version = "4", features = ["derive"] }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
toml = "1.2.1"

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
