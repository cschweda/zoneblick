[package]
name = "zoneblick"
version = "0.0.1"
edition = "2024"
description = "A self-hosted DNS zone watchdog"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
